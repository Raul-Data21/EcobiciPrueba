name: muestreo-largo
on:
  schedule:
    - cron: "7 * * * *"   # respaldo: intenta arrancar cada hora
  workflow_dispatch: {}    # boton "Run workflow" (y la forma en que cada turno llama al siguiente)
permissions:
  contents: write
  actions: write
concurrency:
  group: muestreo
  cancel-in-progress: false
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: formar al siguiente turno en la fila
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run muestreo.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: una foto cada 5 min durante 5.5 horas
        run: |
          git config user.name "muestreador"
          git config user.email "muestreador@users.noreply.github.com"
          fin=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            python muestreador_status.py || echo "foto fallida, sigo"
            git add data
            if git commit -q -m "foto $(date -u +%FT%TZ)"; then
              for i in 1 2 3; do
                git pull -q --rebase origin main && git push -q origin main && break
                sleep 10
              done
            fi
            ahora=$(date +%s)
            sleep $(( 300 - ahora % 300 ))
          done
